name: Unzip site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract index.html
        run: |
          unzip -o terrenos-y-fincas-v2.zip
          if [ ! -f index.html ]; then mv "$(find . -name index.html | head -n 1)" ./index.html; fi
          ls -la
      - name: Commit index.html
        run: |
          git config user.name "digitalinspireus-maker"
          git config user.email "digitalinspireus-maker@users.noreply.github.com"
          rm -f terrenos-y-fincas-v2.zip
          rm -f .github/workflows/unzip.yml
          git add -A
          git status --short
          git commit -m "Add index.html from v2 ZIP" || echo "nothing to commit"
          git push
