name: Update index.html to v3
on:
  push:
    paths:
      - .github/workflows/update-index-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v3 index.html from ZIP
        run: |
          unzip -o terrenos-y-fincas-v3.zip
          test -f index.html
          test $(stat -c%s index.html) -gt 2000000
          ls -l index.html
      - name: Commit v3 index.html
        run: |
          git config user.name "digitalinspireus-maker"
          git config user.email "digitalinspireus-maker@users.noreply.github.com"
          rm terrenos-y-fincas-v3.zip
          git add -A
          git diff --cached --quiet || git commit -m "Update index.html to v3"
          git push
